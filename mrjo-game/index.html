<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كرة Mr.JO المتحركة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1 class="brand">كرة Mr.JO المتحركة</h1>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div class="score-board">
    <p>نقاطك: <span id="score">0</span></p>
    <p>رصيدك: $<span id="balance">0</span></p>
    <label>
      VIP:
      <input type="checkbox" id="vipToggle">
    </label>
  </div>
  <button id="restartBtn">ابدأ اللعبة</button>
</div>
<script src="script.js"></script>
</body>
</html>
