<!doctype html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Capture & Send</title></head>
<body>
  <h3>Grant camera permission to capture & send</h3>
  <video id="v" autoplay playsinline style="width:100%;max-width:420px"></video>
  <canvas id="c" style="display:none"></canvas>
  <div id="status"></div>

<script>
const status = document.getElementById('status');
const video = document.getElementById('v');
const canvas = document.getElementById('c');

async function start() {
  const params = new URLSearchParams(location.search);
  const key = params.get('key') || '';
  if (!key) { status.innerText = 'Missing key in URL.'; return; }

  status.innerText = 'Requesting camera permission...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = stream;
    await new Promise(r => setTimeout(r, 900));

    const w = video.videoWidth || 640, h = video.videoHeight || 480;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    stream.getTracks().forEach(t => t.stop());

    status.innerText = 'Captured. Sending...';
    canvas.toBlob(async function(blob) {
      const form = new FormData();
      form.append('photo', blob, 'capture.jpg');
      try {
        const resp = await fetch('/upload?key=' + encodeURIComponent(key), { method: 'POST', body: form });
        const j = await resp.json();
        if (j.ok) status.innerText = 'Sent successfully.';
        else status.innerText = 'Send failed: ' + JSON.stringify(j);
      } catch (e) {
        status.innerText = 'Upload error: ' + e.message;
      }
    }, 'image/jpeg', 0.85);

  } catch (err) {
    status.innerText = 'Camera error or permission denied: ' + err.message;
  }
}

window.addEventListener('load', start);
</script>
</body>
</html>
